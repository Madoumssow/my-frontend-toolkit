server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression Gzip pour accélérer le chargement des bundles JS/CSS
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # En-têtes de sécurité HTTP standards
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache long terme (1 an) pour les assets compilés avec hash par Vite (/assets/...)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Ne jamais mettre index.html en cache pour que les mises à jour soient immédiates
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Fallback SPA : redirige toutes les routes React Router vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
